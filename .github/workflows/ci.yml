name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 -m unittest discover -s tests/sync
      - run: python3 scripts/check-sw-catalog-version.py
      - name: Install Chromium for service-worker E2E
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Test service-worker catalog refresh and offline isolation
        run: python3 tests/e2e/test_sw_catalog_refresh.py
